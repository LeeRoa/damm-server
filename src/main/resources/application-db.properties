# ==========================================
# [Database Connection - PostgreSQL]
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/damm_db
spring.datasource.username=damm_admin
spring.datasource.password=damm_password

# ==========================================
# [JPA / Hibernate]
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==========================================
# [MyBatis]
# ==========================================
# XML 매퍼 파일이 위치할 경로 지정
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DTO가 있는 패키지 지정 (XML에서 패키지명 생략 가능하게 해줌)
mybatis.type-aliases-package=com.damm.server.modules.area.dto

# DB의 snake_case(area_nm)를 Java의 camelCase(areaNm)로 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# ==========================================
# [Logging] (MyBatis 실행 쿼리를 보기 위한 설정)
# ==========================================
logging.level.com.damm.server.modules.area.repository=DEBUG

# ==========================================
# [P6Spy Query Logging]
# ==========================================
# P6Spy 활성화
decorator.datasource.p6spy.enable-logging=true
# 쿼리를 한 줄이 아닌 여러 줄(예쁘게)로 포맷팅해서 출력
decorator.datasource.p6spy.multiline=true
# 기본 콘솔 출력이 아닌 SLF4J(스프링 기본 로거)를 통해 예쁘게 출력
decorator.datasource.p6spy.logging=slf4j